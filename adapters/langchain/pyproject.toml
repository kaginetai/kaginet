[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kagikai-langchain"
version = "0.7.0"
description = "LangChain tools for Kagikai Bitcoin escrow (ICS)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "See LICENSE"}
authors = [{name = "Kagikai"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "langchain-core>=0.2",
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
tdx = ["kagikai"]

[project.urls]
Homepage = "https://kaginet.com"
Repository = "https://github.com/kagikai/kaginet"
Documentation = "https://kaginet.com/docs"

[tool.setuptools.packages.find]
include = ["kagikai_langchain*"]
